services:
  postgres:
    image: postgres:16-alpine
    container_name: musiclens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musiclens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musiclens}
      POSTGRES_DB: ${POSTGRES_DB:-musiclens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: musiclens-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
