<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicLens</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="screen">
      <div class="glow glow-left"></div>
      <div class="glow glow-right"></div>

      <header class="brand">
        <span class="lens" aria-hidden="true"></span>
        <span class="wordmark">MusicLens</span>
      </header>

      <section class="card">
        <p class="eyebrow">Spotify Recap</p>
        <h1>Dein Sound, durch die Linse.</h1>
        <p class="lead">
          Meistgehörte Songs, Artists und später eigene Dashboards – wie Wrapped,
          nur für dich gebaut.
        </p>

        <button type="button" class="spotify-btn" id="login-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.34c-.24.36-.66.48-1.02.24-2.82-1.74-6.36-2.1-10.56-1.14-.42.12-.78-.18-.9-.54-.12-.42.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.3 1.02zm1.44-3.24c-.3.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.38-.48.12-.96-.18-1.08-.66-.12-.48.18-.96.66-1.08 4.38-1.32 9.78-.66 13.5 1.62.42.24.54.84.12 1.2zm.12-3.36C14.82 8.4 8.4 8.16 4.92 9.24c-.54.18-1.14-.18-1.32-.72-.18-.54.18-1.14.72-1.32 4.02-1.2 11.04-.9 15.42 1.62.54.3.72.96.42 1.44-.3.48-.96.66-1.5.36z"
            />
          </svg>
          Mit Spotify anmelden
        </button>

        <p class="hint" id="login-hint" hidden>
          Login-Seite steht. Die Spotify-API kommt als nächster Schritt.
        </p>
      </section>

      <p class="meta">Modul 321 · Leander Heiniger & Emilio Jordan</p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
